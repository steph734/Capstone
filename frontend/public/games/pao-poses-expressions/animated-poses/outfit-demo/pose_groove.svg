<svg xmlns="http://www.w3.org/2000/svg" class="p-groove"  viewBox="-30 -66 250 322" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible"><style>
.bd,.hd,.eL,.eR,.mo,.ch,.br,.gl,.f1,.f2,.f3,.f4{transform-box:fill-box}
.bd{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.hd{transform-origin:50% 88%}
.eL,.eR,.mo,.ch,.br,.gl,.f1,.f2,.f3,.f4{transform-origin:50% 50%}
.mo{transform-origin:50% 0%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.985)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.5px) rotate(1.6deg)}}
@keyframes proud{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-2.5deg)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.03,.96)}45%{transform:translateY(-9px) scale(.98,1.03)}}
@keyframes twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.35}50%{transform:scale(1.25) rotate(25deg);opacity:1}}
@keyframes ha{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3.5px) rotate(3deg)}}
@keyframes jaw{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}15%{opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes pop{0%,8%,100%{transform:scale(1)}3%{transform:scale(1.09)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes tongue{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2.5px) rotate(-2.5deg)}}
@keyframes glint{0%,60%,100%{opacity:.25;transform:translateX(-4px)}80%{opacity:1;transform:translateX(10px)}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}60%{transform:scale(1.12)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floatup{0%{transform:translateY(8px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-30px) scale(1.15);opacity:0}}
@keyframes droop{0%,100%{transform:rotate(0) translateY(0)}55%{transform:rotate(8deg) translateY(4px)}70%{transform:rotate(7deg) translateY(4px)}88%{transform:rotate(0) translateY(0)}}
@keyframes sink{0%,100%{transform:rotate(-1deg) translateY(1px)}50%{transform:rotate(-3deg) translateY(3px)}}
@keyframes grumble{0%,60%,100%{transform:translateX(0) rotate(0)}64%{transform:translateX(-2.5px) rotate(-1.5deg)}70%{transform:translateX(2.5px) rotate(1.5deg)}76%{transform:translateX(-2.5px) rotate(-1.5deg)}82%{transform:translateX(2px) rotate(1deg)}}
@keyframes twitch{0%,60%,100%{transform:translateY(0)}72%{transform:translateY(2px)}}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes spin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(-12deg)}}
.x-happy .hd{animation:bob 2.6s ease-in-out infinite}
.x-happy .eL,.x-happy .eR{animation:blink 4s infinite}
.x-happy .ch{animation:pulse 2.6s ease-in-out infinite}
.x-proud .hd{animation:proud 3s ease-in-out infinite}
.x-proud .ch{animation:pulse 3s ease-in-out infinite}
.x-proud .mo{animation:breathe2 3s ease-in-out infinite}
.x-wink .hd{animation:tilt 2.8s ease-in-out infinite}
.x-wink .eL{animation:blink 4.4s infinite}
.x-wink .eR{animation:pulse 1.4s ease-in-out infinite}
.x-wink .mo{animation:tongue .7s ease-in-out infinite}
.x-excited .bd{animation:bounce .72s ease-in-out infinite}
.x-excited .eL,.x-excited .eR{animation:pulse .72s ease-in-out infinite}
.x-excited .br{animation:bob .72s ease-in-out infinite}
.x-excited .f1{animation:twinkle 1.2s ease-in-out infinite}
.x-excited .f2{animation:twinkle 1.2s ease-in-out .3s infinite}
.x-excited .f3{animation:twinkle 1.2s ease-in-out .6s infinite}
.x-excited .f4{animation:twinkle 1.2s ease-in-out .9s infinite}
.x-laugh .hd{animation:ha .4s ease-in-out infinite}
.x-laugh .mo{animation:jaw .4s ease-in-out infinite}
.x-laugh .bd{animation:shiver .2s linear infinite}
.x-laugh .f1{animation:fall 1.3s ease-in infinite}
.x-laugh .f2{animation:fall 1.3s ease-in .35s infinite}
.x-laugh .f3{animation:fall 1.3s ease-in .7s infinite}
.x-laugh .f4{animation:fall 1.3s ease-in 1s infinite}
.x-surprised .hd{animation:pop 2.4s ease-out infinite}
.x-surprised .eL,.x-surprised .eR{animation:pulse 1.2s ease-in-out infinite}
.x-surprised .mo{animation:breathe2 1.2s ease-in-out infinite}
.x-surprised .br{animation:bob 1.2s ease-in-out infinite}
.x-surprised .f1,.x-surprised .f2{animation:twinkle .6s ease-in-out infinite}
.x-silly .hd{animation:wobble 1.2s ease-in-out infinite}
.x-silly .mo{animation:tongue .45s ease-in-out infinite}
.x-silly .eL{animation:pulse 1.2s ease-in-out infinite}
.x-silly .eR{animation:pulse 1.2s ease-in-out .6s infinite}
.x-cool .hd{animation:nod 2.8s ease-in-out infinite}
.x-cool .gl{animation:glint 3s ease-in-out infinite}
.x-love .hd{animation:sway 1.8s ease-in-out infinite}
.x-love .eL,.x-love .eR{animation:beat 1.2s ease-in-out infinite}
.x-love .ch{animation:pulse 1.2s ease-in-out infinite}
.x-love .f1{animation:floatup 2.4s ease-out infinite}
.x-love .f2{animation:floatup 2.4s ease-out .6s infinite}
.x-love .f3{animation:floatup 2.4s ease-out 1.2s infinite}
.x-love .f4{animation:floatup 2.4s ease-out 1.8s infinite}
.x-sleepy .hd{animation:droop 4.4s ease-in-out infinite}
.x-sleepy .mo{animation:breathe2 4.4s ease-in-out infinite}
.x-sleepy .f1{animation:floatup 3s ease-out infinite}
.x-sleepy .f2{animation:floatup 3s ease-out 1s infinite}
.x-sleepy .f3{animation:floatup 3s ease-out 2s infinite}
.x-sad .hd{animation:sink 3s ease-in-out infinite}
.x-sad .mo{animation:shiver .3s linear infinite}
.x-sad .eL,.x-sad .eR{animation:pulse 2s ease-in-out infinite}
.x-sad .f1{animation:fall 2s ease-in infinite}
.x-grumpy .hd{animation:grumble 2.4s ease-in-out infinite}
.x-grumpy .br{animation:twitch 2.4s ease-in-out infinite}
.x-grumpy .f1{animation:spin .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bd,.hd,.eL,.eR,.mo,.ch,.br,.gl,.f1,.f2,.f3,.f4{animation:none!important}}

.aL,.aR{transform-box:view-box;transform-origin:0 0}
.sh{transform-box:fill-box;transform-origin:50% 50%}
@keyframes swR{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes swL{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes swR2{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes swL2{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
@keyframes pumpR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}}
@keyframes pumpL{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-10deg)}}
@keyframes flapR{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(8deg)}}
@keyframes flapL{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-8deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.95)}40%{transform:translateY(-8px) scale(.99,1.02)}}
@keyframes leap{0%,100%{transform:translateY(0) scale(1.06,.93)}18%{transform:translateY(0) scale(1.06,.93)}55%{transform:translateY(-18px) scale(.97,1.05)}}
@keyframes shad{0%,18%,100%{transform:scale(1)}55%{transform:scale(.62)}}
@keyframes dust{0%,10%,40%,100%{opacity:0}18%,30%{opacity:1}}
@keyframes rockA{0%,100%{transform:rotate(-6deg) translateY(0)}25%{transform:translateY(-4px)}50%{transform:rotate(6deg) translateY(0)}75%{transform:translateY(-4px)}}
@keyframes rockB{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes rockC{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes headT{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes thinkT{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
@keyframes grow{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes tap{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(2deg)}}
@keyframes squeeze{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-4deg)}}
@keyframes squeezeL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes bubble{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.p-relax .aL{animation:swL2 3.4s ease-in-out infinite}.p-relax .aR{animation:swR2 3.4s ease-in-out infinite}
.p-relax .hd{animation:bob 3.4s ease-in-out infinite}
.p-wave .aR{animation:swR .55s ease-in-out infinite}.p-wave .hd{animation:headT 1.6s ease-in-out infinite}
.p-wave .f1{animation:twinkle .55s ease-in-out infinite}.p-wave .f2{animation:twinkle .55s ease-in-out .27s infinite}
.p-cheer .aR{animation:pumpR .6s ease-in-out infinite}.p-cheer .aL{animation:pumpL .6s ease-in-out infinite}
.p-cheer .bd{animation:hop .6s ease-in-out infinite}
.p-cheer .f1{animation:twinkle 1s infinite}.p-cheer .f2{animation:twinkle 1s .3s infinite}.p-cheer .f3{animation:twinkle 1s .6s infinite}
.p-hello .aR{animation:swR 1.2s ease-in-out infinite}.p-hello .aL{animation:swL 1.2s ease-in-out .6s infinite}
.p-hello .hd{animation:headT 2.4s ease-in-out infinite}
.p-jump .bd{animation:leap 1.1s ease-in-out infinite}.p-jump .sh{animation:shad 1.1s ease-in-out infinite}
.p-jump .aR{animation:flapR 1.1s ease-in-out infinite}.p-jump .aL{animation:flapL 1.1s ease-in-out infinite}
.p-jump .f1{animation:dust 1.1s ease-out infinite}
.p-dance .bd{animation:rockA 1s ease-in-out infinite}.p-dance .aL{animation:flapL .5s ease-in-out infinite}.p-dance .aR{animation:swR2 .5s ease-in-out infinite}
.p-dance .hd{animation:headT 1s ease-in-out infinite reverse}
.p-dance .f1{animation:floatup 2s ease-out infinite}.p-dance .f2{animation:floatup 2s ease-out 1s infinite}
.p-groove .bd{animation:rockB 1.2s ease-in-out infinite}.p-groove .aR{animation:swR .6s ease-in-out infinite}.p-groove .aL{animation:swL2 .6s ease-in-out infinite}
.p-groove .f1{animation:floatup 2s ease-out infinite}.p-groove .f2{animation:floatup 2s ease-out 1s infinite}
.p-tada .aR{animation:pumpR 1.4s ease-in-out infinite}.p-tada .aL{animation:pumpL 1.4s ease-in-out infinite}
.p-tada .bd{animation:grow 1.4s ease-in-out infinite}
.p-tada .f1{animation:twinkle 1.1s infinite}.p-tada .f2{animation:twinkle 1.1s .3s infinite}.p-tada .f3{animation:twinkle 1.1s .6s infinite}.p-tada .f4{animation:twinkle 1.1s .9s infinite}
.p-think .hd{animation:thinkT 3.2s ease-in-out infinite}.p-think .aR{animation:tap 1.6s ease-in-out infinite}
.p-think .f1{animation:bubble 2.4s infinite}.p-think .f2{animation:bubble 2.4s .4s infinite}.p-think .f3{animation:bubble 2.4s .8s infinite}
.p-shy .hd{animation:headT 2.2s ease-in-out infinite}.p-shy .aR{animation:swR2 1.1s ease-in-out infinite}.p-shy .aL{animation:swL2 1.1s ease-in-out infinite}
.p-shy .ch{animation:pulse 1.4s ease-in-out infinite}
.p-shy .f1{animation:floatup 2.4s ease-out infinite}.p-shy .f2{animation:floatup 2.4s ease-out 1.2s infinite}
.p-hug .aR{animation:squeeze 1.6s ease-in-out infinite}.p-hug .aL{animation:squeezeL 1.6s ease-in-out infinite}
.p-hug .bd{animation:grow 1.6s ease-in-out infinite}.p-hug .hd{animation:sway 2.4s ease-in-out infinite}
.p-hug .f1{animation:floatup 2.4s ease-out infinite}.p-hug .f2{animation:floatup 2.4s ease-out 1.2s infinite}
.p-lean .bd{animation:rockC 3s ease-in-out infinite}.p-lean .hd{animation:bob 3s ease-in-out infinite}
.p-lean .aL{animation:swL2 3s ease-in-out infinite}.p-lean .aR{animation:swR2 3s ease-in-out infinite}
.p-relax .eL,.p-relax .eR,.p-wave .eL,.p-wave .eR,.p-hello .eL,.p-hello .eR,.p-lean .eL,.p-lean .eR,.p-think .eL,.p-think .eR,.p-groove .eL,.p-groove .eR{animation:blink 4.2s infinite}
@media (prefers-reduced-motion:reduce){.aL,.aR,.sh{animation:none!important}}
